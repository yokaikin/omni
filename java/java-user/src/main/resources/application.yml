server:
  port: 8081

spring:
  application:
    name: java-user
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/omni_user
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
      config:
        import-check:
          enabled: false
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        file-extension: yaml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: ${SENTINEL_USER_TRANSPORT_PORT:8720}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:123456}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

omni:
  mq:
    enabled: true
  object-storage:
    provider: ${OMNI_OBJECT_STORAGE_PROVIDER:disabled}
    minio:
      endpoint: ${OMNI_OBJECT_STORAGE_ENDPOINT:}
      public-endpoint: ${OMNI_OBJECT_STORAGE_PUBLIC_ENDPOINT:}
      access-key: ${OMNI_OBJECT_STORAGE_ACCESS_KEY:}
      secret-key: ${OMNI_OBJECT_STORAGE_SECRET_KEY:}
      bucket: ${OMNI_OBJECT_STORAGE_BUCKET:omni-assets}
  virus-scanner:
    provider: ${OMNI_VIRUS_SCANNER_PROVIDER:disabled}
    fail-open: ${OMNI_VIRUS_SCANNER_FAIL_OPEN:false}
    clamd:
      host: ${OMNI_CLAMD_HOST:localhost}
      port: ${OMNI_CLAMD_PORT:3310}
  grab-service:
    url: ${GRAB_SERVICE_URL:http://localhost:3001}
  support:
    ai:
      enabled: ${OMNI_SUPPORT_AI_ENABLED:${OMNI_SUPPORT_AI_LOCAL_ENABLED:true}}
      endpoint: ${OMNI_SUPPORT_AI_ENDPOINT:${OMNI_SUPPORT_AI_LOCAL_ENDPOINT:http://localhost:11434/api/chat}}
      model: ${OMNI_SUPPORT_AI_MODEL:${OMNI_SUPPORT_AI_LOCAL_MODEL:Qwen2.5:7b}}
      timeout-ms: ${OMNI_SUPPORT_AI_TIMEOUT_MS:${OMNI_SUPPORT_AI_LOCAL_TIMEOUT_MS:30000}}
      context-window: ${OMNI_SUPPORT_AI_CONTEXT_WINDOW:${OMNI_SUPPORT_AI_LOCAL_CONTEXT_WINDOW:2048}}
      api-key: ${OMNI_SUPPORT_AI_API_KEY:}
      local:
        enabled: ${OMNI_SUPPORT_AI_LOCAL_ENABLED:${OMNI_SUPPORT_AI_ENABLED:true}}
        endpoint: ${OMNI_SUPPORT_AI_LOCAL_ENDPOINT:${OMNI_SUPPORT_AI_ENDPOINT:http://localhost:11434/api/chat}}
        model: ${OMNI_SUPPORT_AI_LOCAL_MODEL:${OMNI_SUPPORT_AI_MODEL:Qwen2.5:7b}}
        timeout-ms: ${OMNI_SUPPORT_AI_LOCAL_TIMEOUT_MS:${OMNI_SUPPORT_AI_TIMEOUT_MS:30000}}
        context-window: ${OMNI_SUPPORT_AI_LOCAL_CONTEXT_WINDOW:${OMNI_SUPPORT_AI_CONTEXT_WINDOW:2048}}

internal:
  api:
    token: ${INTERNAL_API_TOKEN:omni-local-internal-token}
